syntax = "proto3";

package message.skill;

import "Vector.proto";

/// Runs one of the mjlab K1 ball-skill policies. The provider is skill::Walk, which also runs the walk policy, so the
/// observation history carries across a switch between skills (see module/skill/Walk/README.md).
message BallSkill {
    enum Type {
        /// Trap a pass rolling in and hold the ball at the feet. The velocity is ignored (trained with zero).
        RECEIVE = 0;
        /// Dribble the ball at the commanded ball velocity, 0.4 to 1.8 m/s, or zero to hold it
        DRIBBLE = 1;
        /// Ground kick with the commanded ball exit velocity, 2 to 7 m/s. Hold the command until the ball has gone.
        KICK = 2;
        /// Air shot with the commanded ground part of the exit velocity, as KICK. The ball rises at about 30 degrees.
        KICK_AIR = 3;
        /// Directional first touch of a pass rolling in, sending the ball off at the commanded velocity, 0.5 to 1.2 m/s
        FIRST_TOUCH = 4;
        /// First-time pass of a pass rolling in, at the commanded velocity, 2 to 4 m/s
        FIRST_PASS = 5;
    }
    /// Which policy to run
    Type type = 1;
    /// Commanded ball velocity in the robot's yaw frame (x forward, y left, rotated by the robot's heading only), m/s
    vec2 velocity = 2;
}
