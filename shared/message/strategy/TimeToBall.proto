syntax = "proto3";

package message.strategy;

/// This robot's estimate of how long a single robot would take to reach the ball
message TimeToBallEstimate {
    /// Player ID of the robot this estimate is for (ourselves or a teammate)
    uint32 player_id = 1;
    /// Estimated time to reach the ball, in seconds
    float time_to_ball = 2;
}

/// This robot's own estimate of how long it - and each teammate it can currently see - would take to
/// reach the ball. Computed locally, so this is this robot's opinion only; teammates do not report
/// this value about themselves.
message TimeToBall {
    repeated TimeToBallEstimate estimates = 1;
}
