syntax = "proto3";

package message.localisation;

import "Vector.proto";
import "google/protobuf/timestamp.proto";
import "message/localisation/Ball.proto";
import "message/localisation/Robot.proto";

/// The ball estimated by localisation::CooperativeLocalisation, a joint square-root information filter that fuses
/// this robot's ball detections with the detections its teammates share over team communication
message CooperativeBall {
    /// The ball estimate in world {w} space, with the same conventions as localisation::BallLocalisation's Ball.
    /// time_of_measurement is the time of the most recent detection fused, from any robot
    Ball ball = 1;
    /// Player ids of the robots (including this one) with a detection fused into the ball in the last second
    repeated uint32 observers = 2;
}

/// The robots estimated by localisation::CooperativeLocalisation from every teammate's robot detections. Detections of
/// teammates are removed using the teammates' reported positions, so these are opponents (or unidentified robots)
message CooperativeRobots {
    /// The robot estimates in world {w} space. teammate is always false
    repeated Robot robots = 1;
}

/// This robot's most recent detections in field {f} space, for network::RobotCommunication to share with teammates
message CooperativeDetections {
    /// One camera frame's detections of one kind of object
    message Detections {
        /// When the camera frame was taken
        google.protobuf.Timestamp timestamp = 1;
        /// Position of the camera on the field {f} when the frame was taken
        vec2 rCFf = 2;
        /// The detected positions on the field {f}: the ball centre's ground point, or the robot's foot point
        repeated vec2 positions = 3;
    }
    /// The most recent frame with at least one ball detection, if any
    Detections balls = 1;
    /// The most recent frame with at least one robot detection, if any
    Detections robots = 2;
}
