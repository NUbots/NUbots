syntax = "proto3";

package message.platform;

import "Vector.proto";

/// Places or rolls the ball in NUSim (rt/nusim/ball_command). Sim only: a real robot has nothing listening.
/// Published by input::NUSimGroundTruth.
message NUSimBallCommand {
    enum Frame {
        /// NUSim's world frame, which is the field frame of the scene
        WORLD = 0;
        /// The robot's yaw-only frame at its torso, projected to the ground: x forward, y left, z up
        ROBOT = 1;
    }
    Frame frame = 1;
    /// Where to put the ball's centre. A negative z rests it on the floor at its radius.
    vec3 position = 2;
    /// Velocity to give the ball's centre, m/s
    vec3 velocity = 3;
    /// Give the ball the spin of rolling without slipping at that velocity, so it does not skid on its first contact
    bool rolling = 4;
}
