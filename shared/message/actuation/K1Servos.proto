syntax = "proto3";

package message.actuation;

import "message/booster/BoosterLowCmd.proto";

/**
 * Whole-body K1 low-level actuation Task. Wraps a BoosterLowCmd so the Director
 * can arbitrate ownership of the K1's single low-level channel between the walk,
 * kick and get-up policies by priority (subsumption: get-up > kick > walk). The
 * module::actuation::K1Servos provider forwards the winning requester's command
 * to the platform as a raw BoosterLowCmd (nubridge / Booster HardwareIO). This is
 * the K1/Booster analogue of the NUgus ServoTarget path, which K1 does not use.
 */
message K1Servos {
    /// The low-level joint command (per-motor q/dq/tau/kp/kd/weight) to actuate.
    booster.BoosterLowCmd command = 1;
}
