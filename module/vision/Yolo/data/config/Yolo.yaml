# Controls the minimum log level that NUClear log will display
log_level: INFO

# Path to the model weights
model_path: "booster.onnx"

# Minimum confidence required for a ball detection to be accepted
ball_confidence_threshold: 0.45

# Minimum confidence required for a goal detection to be accepted
goalpost_confidence_threshold: 0.2

# Minimum confidence required for a person/robot detection to be accepted
robot_confidence_threshold: 0.2

# Minimum confidence required for an L-intersection detection to be accepted
l_intersection_confidence_threshold: 0.1

# Minimum confidence required for a T-intersection detection to be accepted
t_intersection_confidence_threshold: 0.1

# Minimum confidence required for an X-intersection detection to be accepted
x_intersection_confidence_threshold: 0.1

# Minimum confidence required for a penalty point detection to be accepted
penalty_point_confidence_threshold: 0.1

# NMS threshold for filtering out overlapping bounding boxes
nms_threshold: 0.5

# NMS confidence (score) threshold for filtering out low confidence detections
nms_score_threshold: 0.1

# OpenVino device (CPU, GPU)
device: GPU
