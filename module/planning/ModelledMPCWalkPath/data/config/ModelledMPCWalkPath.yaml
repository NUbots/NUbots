# Controls the minimum log level that NUClear log will display
log_level: INFO

# Command limits: the capability envelope's extent along each axis, clipped to the range the response model was
# identified on. Written by codegen/import_envelope.py, with the envelope below.
# Maximum velocity command per axis [vx (m/s), vy (m/s), vtheta (rad/s)]
max_velocity: [1.75, 1.4, 1.5]
# Maximum backward command (m/s)
max_backward_velocity: 1.5
# Maximum change of the command per second [m/s², m/s², rad/s²], as MPCWalkPath.yaml
max_acceleration: [1.0, 1.0, 2.0]

# Cost weights, MPCWalkPath's. See the README for the cost function.
# Pseudo-Huber distance to the target: quadratic within huber_delta (m), linear beyond, which approximates minimum time
w_position: 1.0
huber_delta: 0.2
# Final-heading error, faded in within about heading_radius (m) of the target
w_heading: 1.0
heading_radius: 0.6
# Facing the direction of travel far from the target. 0 leaves the heading free there.
w_face: 0.0
# Delivered velocity magnitude (predicted by the model) and change of command between steps, per axis [vx, vy, vtheta]
w_effort: [0.01, 0.01, 0.01]
w_rate: [1.0, 1.0, 0.5]

# Clearance kept from other robots (m), as PlanWalkPath's obstacle_radius
obstacle_radius: 0.8
# Penalty on getting inside an obstacle's clearance. The constraint is soft, so the problem stays solvable when the
# robot is already inside one.
w_slack: 1000.0

# Penalty on commands outside the capability envelope (below). The envelope is soft, so a command sent from outside it
# (e.g. the fallback's) can't make the problem unsolvable.
w_envelope: 1000.0
# Shrinks the capability envelope (below) towards standing still: each row's bound d is multiplied by this, so 0.9
# keeps the commands 10 % inside the edges the policy was measured to track
envelope_scale: 1.0

# Width over which the solver's model smooths the piecewise-linear maps' kinks, for the paths of each command axis
# [vx, vy, vtheta], in command units. A map that isn't monotonic (a larger command delivering less) is a local minimum
# the solver can't leave, so it needs to be wide enough to merge close breakpoints that make one: on vy, the fitted
# map's notch between -0.288 and -0.271 m/s, which otherwise traps a sidestep at -0.287. Narrow keeps the dead zones'
# edges sharp. The estimate of the robot's state uses the unsmoothed model.
kink_smoothing: [0.01, 0.03, 0.05]

# SQP iterations per solve. With a warm start a few are enough; reaching the cap is not a failure.
max_iterations: 10
# Seconds. A solve that takes longer, or fails, sends PlanWalkPath's control law's command instead.
time_budget: 0.05
# Seconds without a WalkTo after which the next solve starts from standing still
stale_time: 0.5

# The fallback, PlanWalkPath's WalkTo control law and dead zone, with the limits above (values from PlanWalkPath.yaml)
fallback:
  k_translation: 1.5 # (1/s) translational speed per metre of distance to target
  k_theta: 2.0 # (1/s) angular velocity per radian of heading error
  max_align_radius: 1.5 # Radius [m] to begin omnidirectional approach and aligning with target heading
  min_align_radius: 0.4 # Radius [m] within which fully aligned with the target heading
  max_angle_error: 45 * pi / 180 # Heading error above which we only rotate on the spot
  min_angle_error: 20 * pi / 180 # Heading error below which full forward speed is allowed
  min_velocity: [0.35, 0.45, 1.0] # Smaller nonzero commands are bumped up to these
  zero_tolerance: [0.05, 0.05, 0.05] # Commands below this per-axis magnitude are snapped to zero
  rotate_velocity_x: 0.2 # Forward velocity given to a turn with no translation

# ---- The capability envelope. Written by codegen/import_envelope.py: edit by re-importing. ----
# Fitted to k1-poi732yy-evaluation: the commands the policy survived and tracked to within 0.2 m/s and rad/s in steady
# state, as one polygon per command plane. Each row [n_vx, n_vy, n_wz, d] is the constraint n_vx·vx + n_vy·vy +
# n_wz·wz ≤ d on the command, held softly (w_envelope).
#   vx × vy (grid_vx_vy_poi732yy, wz = 0): 794 of 1681 commands kept, 85 of the 879 inside the polygon not
#   vx × wz (grid_vx_wz_poi732yy, vy = 0): 1173 of 1681 commands kept, 112 of the 1285 inside the polygon not
#   vy × wz (grid_vy_wz_poi732yy, vx = 0.2): 1045 of 1681 commands kept, 91 of the 1136 inside the polygon not
envelope:
  # vx × vy
  - [1, 0, 0, 2]
  - [0.707107, 0.707107, 0, 1.76777]
  - [0, 1, 0, 1.5]
  - [-0.707107, 0.707107, 0, 1.41421]
  - [-1, 0, 0, 1.5]
  - [-0.707107, -0.707107, 0, 1.48492]
  - [0, -1, 0, 1.4]
  - [0.707107, -0.707107, 0, 1.69706]
  # vx × wz
  - [1, 0, 0, 2]
  - [0.707107, 0, 0.707107, 1.9799]
  - [0, 0, 1, 2]
  - [-0.707107, 0, 0.707107, 2.05061]
  - [-1, 0, 0, 1.5]
  - [-0.707107, 0, -0.707107, 2.05061]
  - [0, 0, -1, 2]
  - [0.707107, 0, -0.707107, 2.05061]
  # vy × wz
  - [0, 1, 0, 1.5]
  - [0, 0.707107, 0.707107, 2.05061]
  - [0, 0, 1, 2]
  - [0, -0.707107, 0.707107, 1.90919]
  - [0, -1, 0, 1.4]
  - [0, -0.707107, -0.707107, 1.9799]
  - [0, 0, -1, 2]
  - [0, 0.707107, -0.707107, 2.05061]
