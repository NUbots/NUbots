# Controls the minimum log level that NUClear log will display
log_level: INFO

# Maximum velocity command per axis [vx (m/s), vy (m/s), vtheta (rad/s)]
# vx capped at 0.8: the deployed walk policy serves 0.62 m/s at a 0.8 command and stalls
# outright at 1.0 (measured, NUSim surface sweep 2026-08-12), so commanding past its
# ceiling asks for a velocity it answers by standing still.
max_velocity: [0.8, 0.5, 1.0]
# Maximum backward speed (m/s), fast backward walking is unstable
max_backward_velocity: 0.15
# The walk policy (poi732yy) stands still for a command too small to start stepping, measured from standing in NUSim
# (2026-10-07): vx 0.3 stands and 0.35 delivers 0.29, vy 0.4 stands and 0.45 delivers 0.46, and a pure rotation stands
# however fast (even 1.5 rad/s). It turns on the spot given a little forward velocity: (0.2, 0, 1.0) delivers
# (0.11, 0, 0.91). Translations are bumped onto the ellipse with semi-axes min_velocity x and y, and a turn with no
# translation gets rotate_velocity_x and at least min_velocity z.
min_velocity: [0.35, 0.45, 1.0]
# Smoothed commands with per-axis magnitude below this are treated as a stop
zero_tolerance: [0.05, 0.05, 0.05]

# Proportional gains
k_translation: 1.5 # (1/s) translational speed per metre of distance to target
k_theta: 2.0 # (1/s) angular velocity per radian of heading error

max_align_radius: 1.5 # Radius [m] to begin omnidirectional approach and aligning with target heading
min_align_radius: 0.4 # Radius [m] within which fully aligned with the target heading
max_angle_error: 45 * pi / 180 # Heading error above which we only rotate on the spot
min_angle_error: 20 * pi / 180 # Heading error below which full forward speed is allowed

# Rotate on the spot tuning values. rotate_velocity_x is also given to any turn with no translation (see min_velocity)
rotate_velocity: 1.0
rotate_velocity_x: 0.2
rotate_velocity_y: 0.0

# Rotate around ball tuning values. Orbit kinematics give vy = -vtheta * pivot_radius, keep
# pivot_angular_velocity * pivot_radius >= min_velocity[1] or the dead-zone bump widens the orbit
pivot_angular_velocity: 0.8
pivot_radius: 0.2
pivot_forward_velocity: 0.0

# Adjust (orbit the ball to fix approach angle) tuning values
adjust_range: 0.5
adjust_vx_limit: 0.5
adjust_vy_limit: 0.6
adjust_vtheta_limit: 1.0 # training samples ang_vel_yaw [-1, 1]; 1.5 was out of distribution
adjust_vtheta_factor: 4.5
adjust_tangential_speed_far: 0.9
adjust_tangential_speed_near: 0.4
adjust_near_threshold: 0.8
adjust_no_turn_threshold: 0.1
adjust_turn_first_threshold: 0.5

# Radius around obstacles to avoid
obstacle_radius: 0.8

# Exponential smoothing time constant for the [x,y,theta]-velocity (set to [0,0,0] to disable smoothing)
tau: [0.3, 0.3, 0.2]
