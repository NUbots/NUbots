# Controls the minimum log level that NUClear log will display
log_level: INFO

# UKF config
ukf:
  noise:
    measurement:
      robot_position: [0.1, 0.1]
    process:
      position: [1e-1, 1e-1]
      velocity: [1e-2, 1e-2]

  initial_covariance:
    position: [1e-3, 1e-3]
    velocity: [1e-3, 1e-3]

association_distance: 0.5

max_missed_count: 25

# How long (seconds) without a comms message before a teammate is considered gone. Teammates broadcast
# at 2 Hz (see RobotCommunication.yaml), so this allows for a handful of dropped packets.
teammate_timeout: 3

max_distance_from_field: 1.0

max_localisation_cost: 2.0
