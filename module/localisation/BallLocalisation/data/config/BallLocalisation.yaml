# Controls the minimum log level that NUClear log will display
log_level: INFO

# UKF config
ukf:
  noise:
    measurement:
      ball_position: [0.1, 0.1]
    process:
      position: [1e-2, 1e-2]
      velocity: [1e-2, 1e-2]

  initial:
    mean:
      position: [5.0, 0.0]
      velocity: [0.0, 0.0]
    covariance:
      position: [1e-3, 1e-3]
      velocity: [1e-3, 1e-3]

# Maximum distance a ball can be from current mean to be accepted as a measurement
acceptance_radius: 2

# Maximum number of ball rejections before acceptance
max_rejections: 25

# Maximum distance in meters from the field that a ball can be before it is ignored
max_distance_from_field: 1.0

# Fall back to the cooperative ball (localisation::CooperativeLocalisation, fused from every teammate's detections)
# when we have lost the ball ourselves
use_cooperative_ball: true
# Seconds without an accepted ball of our own before the cooperative ball is used
cooperative_ball_timeout: 1.0
# Only use the cooperative ball while its latest fused detection (from any robot) is at most this many seconds old
cooperative_ball_max_age: 1.0
