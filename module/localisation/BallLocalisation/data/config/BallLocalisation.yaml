# Controls the minimum log level that NUClear log will display
log_level: INFO

# Constant-velocity UKF on the ball's world position and velocity, run in image time
ukf:
  noise:
    measurement:
      # Detection position standard deviation (m) = base + per_metre * range from the camera.
      # Sized to frame-to-frame jitter, not detector bias, or the velocity is slow to follow a kick.
      base: 0.03
      per_metre: 0.02
    process:
      # White-noise-acceleration spectral density (m^2/s^3). Kicks are handled by association, not this noise.
      acceleration: 2.0

  initial:
    # Covariance on (re)acquisition: position (m^2), velocity ((m/s)^2)
    covariance:
      position: [0.1, 0.1]
      velocity: [4.0, 4.0]

motion:
  # Rolling resistance deceleration (m/s^2). NUSim's ball slows at about 0.5 m/s^2.
  rolling_deceleration: 0.5

association:
  # Squared Mahalanobis distance within which a detection updates the track (chi^2, 2 dof, 99%)
  gate: 9.21
  # Fastest the ball can travel (m/s), bounds which detections outside the gate can be a kick
  max_ball_speed: 8.0
  # Velocity standard deviation (m/s) opened up on a kick, so the track can follow the new velocity
  kick_velocity_std: 4.0
  # Extra distance (m) a detection may move between consecutive images and still confirm itself
  confirm_radius: 0.3
  # Seconds without an accepted detection before the track is lost
  reacquire_after: 0.5
  # Manoeuvre detection: when the normalised running average of the innovations passes manoeuvre_threshold, the
  # velocity covariance is opened up. At smoothing 0.5, 3.0 is about the 99th percentile for a still ball.
  manoeuvre_smoothing: 0.5
  manoeuvre_threshold: 3.0

# Robot to robot communication parameters
use_r2r_balls: true

# Maximum time in seconds before a teammates ball is discarded
team_ball_recency: 3.0

# Maximum acceptable standard deviation in meters for the combined team ball
team_guess_error: 0.5

# Maximimum time in seconds where we have not seen the ball before defaulting to team guesses
team_guess_default_timer: 2.0

# Maximum distance in meters from the field that a ball can be before it is ignored
max_distance_from_field: 1.0
