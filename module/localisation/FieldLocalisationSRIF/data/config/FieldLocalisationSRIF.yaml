log_level: INFO

# Parameters that change with the robot, the venue or the game. The rest are in struct Config in
# FieldLocalisationSRIF.hpp.

# What the filter runs

# Multi-hypothesis (field-symmetry) Gaussian mixture bank. Off keeps a single Gaussian.
# TODO: decide whether to keep this at all.
use_hypothesis_bank: false

# Out-of-field side disambiguation: scores the current pose against its 180 deg mirror using
# background scenery
# TODO: confirm timing, and the interaction with use_hypothesis_bank.
use_side_disambiguator: false

# Accelerometer gravity-direction measurement of torso roll/pitch.
# TODO: compare on/off and remove if unneeded.
use_gravity: true

# Forward-kinematic torso height, used only while the robot is upright
# TODO: test how bad turning this off actually is.
use_kinematic_height: true

# Noise standard deviations of each sensor
# TODO: replace with measured values where possible.

gyroscope_sigma: 0.02 # [rad/s] per axis

# Which signal measures the body linear velocity vBb:
#   HTW_DIFFERENCE - finite difference of consecutive Sensors.Htw
#   SENSORS_VTW    - Sensors.vTw rotated into the torso frame
odometry_velocity_source: SENSORS_VTW

odometry_velocity_sigma: 0.15 # body linear velocity [m/s] per axis
gravity_sigma: 1.0 # accelerometer gravity-direction noise [m/s^2] (TODO: why so large?)
height_sigma: 0.02 # kinematic torso-height noise [m]

# Vision noise and association
measurement:
  sigma_angular: 0.25 # inlier ray angular noise [rad]
  gate_angle: 0.35 # max association residual angle [rad], widened by the yaw std
  min_confidence: 0.5 # YOLO confidence below which a detection is discarded

# Process noise. Raise if the filter lags the robot, lower if the pose is twitchy.
process:
  sigma_vel: 0.35 # body linear velocity random walk [m/s/sqrt(s)]
  sigma_omega: 1.50 # body angular velocity random walk [rad/s/sqrt(s)]

# Uncertainty restored on standing up after a fall
fall:
  recovery_pos_std: 0.5 # horizontal position std [m]
  recovery_yaw_std: 0.6 # yaw std [rad]
