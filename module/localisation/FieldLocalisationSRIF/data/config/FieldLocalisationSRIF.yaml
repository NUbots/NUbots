log_level: INFO

# Parameters that change with the robot, the venue or the game. Everything else is in
# struct Config in FieldLocalisationSRIF.hpp.

# --- What the filter runs ------------------------------------------------------------------------

# Multi-hypothesis (field-symmetry) Gaussian mixture bank. Off keeps a single Gaussian.
# TODO: decide whether to keep this at all.
use_hypothesis_bank: false

# Out-of-field side disambiguation: scores the current pose against its 180 deg mirror using
# background scenery. Costs roughly 4 ms per camera frame.
# TODO: confirm timing, and the interaction with use_hypothesis_bank.
use_side_disambiguator: false

# Accelerometer gravity-direction measurement of torso roll/pitch.
# TODO: compare on/off and remove if unneeded.
use_gravity: true

# Forward-kinematic torso height. Suppressed automatically while the robot is not upright.
# TODO: test how bad turning this off actually is.
use_kinematic_height: true

# --- How far each sensor is trusted (noise standard deviations) -----------------------------------
# The values in this file were tuned in NUSim against ground truth (see the README's Tuning section), whose
# odometry error model is fit to the real K1's. NUSim's vision is cleaner than a real camera's, so sigma_angular and
# the association gate may need loosening on a real robot.

gyroscope_sigma: 0.011 # [rad/s] per axis

# Which signal measures the body linear velocity vBb.
#   HTW_DIFFERENCE - finite difference of consecutive Sensors.Htw. Available on every platform.
#   SENSORS_VTW    - Sensors.vTw rotated into the torso frame. For platforms whose odometry is a
#                    real state estimator.
odometry_velocity_source: SENSORS_VTW

# body linear velocity [m/s] per axis; size it for the source above. Large because the K1's odometry velocity has a
# scale error and a wandering bias of ~0.1 m/s (and the torso's step-to-step sway), so vision has to carry position
odometry_velocity_sigma: 0.45
gravity_sigma: 1.1 # accelerometer gravity-direction noise [m/s^2] (TODO: why so large?)
height_sigma: 0.034 # kinematic torso-height noise [m]

# --- How far vision is trusted --------------------------------------------------------------------
measurement:
  sigma_angular: 0.05 # inlier ray angular noise [rad]
  gate_angle: 0.79 # max association residual angle [rad]; widened at runtime by the yaw std
  min_confidence: 0.45 # YOLO confidence below which a detection is discarded
  gate_yaw_scale: 3.2 # yaw std devs the association gate widens by, so an uncertain belief can re-associate
  gate_angle_max: 1.48 # ceiling on the widened association gate [rad]
  # Robust mixture: a detection's chance of being a real landmark rather than clutter, from its confidence
  inlier_probability: 0.77 # inlier weight of a detection at confidence_reference
  confidence_reference: 0.7 # confidence that maps to inlier_probability
  max_inlier_probability: 0.96 # cap, so no detection is treated as certainly real

# --- How fast the belief may move -----------------------------------------------------------------
# Raise if the filter lags the robot, lower if the pose is twitchy.
process:
  sigma_vel: 1.3 # body linear velocity random walk [m/s/sqrt(s)]
  sigma_omega: 0.22 # body angular velocity random walk [rad/s/sqrt(s)]
  # Floors on how fast the pose itself may wander, on top of integrating the velocities above
  sigma_pos_xy: 0.11 # horizontal position random walk [m/sqrt(s)]
  sigma_yaw: 0.0037 # yaw random walk [rad/sqrt(s)]
  sigma_gyro_bias: 1.7e-4 # gyroscope bias random walk [rad/s/sqrt(s)]
  sigma_cam_bias: 4.3e-4 # camera-mount attitude bias random walk [rad/sqrt(s)]

# --- How much confidence a fall costs -------------------------------------------------------------
# Restored on standing up. Also reopens the landmark association gate.
fall:
  recovery_pos_std: 0.5 # horizontal position std [m]
  recovery_yaw_std: 0.6 # yaw std [rad]
