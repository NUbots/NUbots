log_level: INFO

# Sign of field-x for the robot's starting half (from game context). Breaks the field's 180 deg
# symmetry that on-field landmarks cannot: +1 => starts in the +x half, -1 => the -x half, 0 => no prior.
own_half_x_sign: 1.0

# Multi-hypothesis (field-symmetry) Gaussian mixture bank. Off keeps a single Gaussian.
# Note: This cannot resolve the symmetry problem. On-field landmarks fit a pose and its 180 deg
# mirror equally well (each component is now scored on its OWN association), so the pair sits at a
# genuine 50/50 and the reported pose stays with the bootstrapped hypothesis. Breaking the tie needs
# asymmetric off-field evidence fed in via SystemLocalisation::addSideLogEvidence, which this module
# does not yet source (see utility::slam::SideDisambiguator).
use_hypothesis_bank: false

# Body-rate measurements. The gyroscope and the walk-engine odometry are no longer known inputs to the
# process model - they are measurements of the body angular and linear velocity states. That is what
# lets their noise be modelled honestly and, for the gyroscope, what makes its bias an estimated state
# rather than a heuristic subtracted up front. Sensors.gyroscope is raw (SensorFilter passes the
# hardware value through and Mahony keeps its bias internal), so there is no double-correction.
use_gyroscope: true
gyroscope_sigma: 0.02 # gyroscope noise std dev per axis [rad/s]
use_odometry_velocity: true
# Deliberately loose, comparable to the walk speed itself: the odometry slips on foot contact and
# reports the gait the engine believes it is executing. As a measurement that is evidence the filter can
# weigh, never truth it has to accept.
odometry_velocity_sigma: 0.15 # [m/s]
# Zero-velocity updates while the robot is down. A robot on the carpet is not travelling anywhere, and
# saying so is the only thing stopping the pre-fall gait from integrating across the whole fall.
# Leaving it unmeasured is not the neutral choice it looks like - it asserts the robot may still be
# moving at whatever it was doing when it fell.
zupt_sigma: 0.02 # [m/s] FALLEN, lying still
zupt_dynamic_sigma: 0.30 # [m/s] FALLING or getting up - the torso moves, just not anywhere

# Low-rate corrections
# Accelerometer gravity-direction measurement of torso roll/pitch, from the calibrated m/s^2
# Sensors.accelerometer. The gravity-aligned attitude is also estimated upstream by the Mahony filter
# and delivered via Htw, so this is a secondary anchor and may be turned off if Htw is trusted alone.
use_gravity: true
gravity_sigma: 1.0 # accelerometer gravity-direction noise std dev [m/s^2]
# The accelerometer reads gravity whenever the torso is not being accelerated - true of a robot lying
# still on the carpet, false of one in free fall or hitting the ground. Gating on how far the specific
# force sits from standard gravity tests that directly, which is the right condition during a fall and a
# better one than "is the robot upright" while walking. Loose on purpose: gait swings the magnitude by a
# couple of m/s^2 and the model already carries gravity_sigma of noise.
gravity_quasi_static_tolerance: 3.0 # [m/s^2] from standard gravity
# Torso height above ground assumes the support leg reaches the ground, so this is the one model a fall
# genuinely invalidates - it is suppressed while the robot is not upright (see fall: below).
use_kinematic_height: true
height_sigma: 0.02 # kinematic torso-height noise std dev [m]
# Soft |q| = 1 prior. The four attitude states carry three degrees of freedom and quat2rot normalises, so
# no other model can see |q|; without this the MAP Hessian is singular along it.
quaternion_norm_sigma: 1.0e-3

# Fall handling. Measurement updates are NOT suppressed wholesale while the robot is down: the landmark
# model is plain geometry and stays valid face-down, and a robot that spins while toppling or getting up
# changes its heading, which only measurements taken during the event can catch.
fall:
  # Confidence handed back on standing up again. The mean is kept - a fall and getup move the torso well
  # under a metre, so the pre-fall position is still the best estimate available - but the confidence
  # attached to it is not survivable, above all in yaw.
  recovery_pos_std: 0.5 # horizontal position std restored on recovery [m]
  recovery_yaw_std: 0.6 # yaw std restored on recovery [rad]

# Odometry twist buffer
max_odometry_gap: 0.1 # max sample spacing to finite-difference across [s]
twist_window_seconds: 2.0 # rolling odometry window length [s]
max_sensor_pairing_age: 0.1 # max age of the odometry sample paired with a vision frame [s]

# Initial-pose grid search
grid_step_xy: 0.35 # position step [m]
grid_step_yaw: 18.0 # heading step [deg]
min_init_associations: 4 # landmark associations needed to trust a solve
# Initial sqrt-covariance diagonal for the 18-dim state.
# Attitude is a quaternion, not roll/pitch/yaw: a tangent-space std of s becomes a component std of s/2,
# so the 0.5 rad of initial yaw doubt the old layout carried is 0.25 across the four components.
# [x, y, z | qw, qx, qy, qz | vx, vy, vz | wx, wy, wz | bgx, bgy, bgz | cam_roll, cam_pitch]
initial_sqrt_covariance:
  [1.0, 1.0, 0.05, 0.25, 0.25, 0.25, 0.25, 0.30, 0.30, 0.10, 0.50, 0.50, 0.50, 0.05, 0.05, 0.05, 0.02, 0.02]

# Process noise power spectral densities
process:
  sigma_pos_xy: 0.02 # horizontal position [m/sqrt(s)]
  sigma_pos_z: 0.01 # vertical position [m/sqrt(s)]
  sigma_att: 0.01 # roll/pitch [rad/sqrt(s)]
  sigma_yaw: 0.01 # yaw [rad/sqrt(s)]
  sigma_cam_bias: 3.0e-4 # camera-mount bias [rad/sqrt(s)]
  # While the robot is not upright the process model is not merely noisier, it is wrong: the twist input's
  # linear velocity comes from walk-engine odometry, which reports the gait it believes it is executing
  # rather than the metre the torso travels while toppling and being levered back up. That velocity is
  # discarded for the WHOLE time the robot is down (it does not become meaningful again after N seconds).
  # These PSDs are what the belief decays towards meanwhile. The camera-mount bias keeps its ordinary tiny
  # PSD: a fall is no reason to let the extrinsic calibration wander.
  sigma_pos_xy_disturbed: 0.20 # horizontal position while not upright [m/sqrt(s)]
  sigma_pos_z_disturbed: 0.20 # vertical position while not upright [m/sqrt(s)]
  sigma_att_disturbed: 0.20 # roll/pitch while not upright [rad/sqrt(s)]
  sigma_yaw_disturbed: 0.20 # yaw while not upright [rad/sqrt(s)]
  # The body-fixed rates. These are the dominant process noise now: uncertainty reaches position by
  # integrating velocity uncertainty, which is where the real ignorance lives, so the pose PSDs above
  # are only a floor against collapse in weakly-observable directions.
  sigma_vel: 0.35 # body linear velocity [m/s/sqrt(s)]
  sigma_omega: 1.50 # body angular velocity [rad/s/sqrt(s)]
  sigma_gyro_bias: 2.0e-4 # gyroscope bias random walk [rad/s/sqrt(s)]: slow thermal drift only
  sigma_vel_disturbed: 1.00 # body linear velocity while not upright [m/s/sqrt(s)]
  sigma_omega_disturbed: 3.00 # body angular velocity while not upright [rad/s/sqrt(s)]
  # How long into a fall the PSDs above apply [s]. A fall is a bounded event; running them for its whole
  # duration models a robot lying still as a random walk, so the belief would report how long it had been
  # down rather than how far it could have gone. This bounds the PSDs ONLY - never the velocity discard.
  disturbed_window: 2.0

# Landmark ray measurement
measurement:
  sigma_angular: 0.25 # inlier ray angular noise std dev [rad]
  gate_angle: 0.35 # max association residual angle [rad]
  # The pre-gate is a hard geometric cap, so on its own it also caps what the filter can recover from: a
  # getup leaving the robot yawed past gate_angle puts every predicted bearing outside it, and covariance
  # inflation does not help because the pre-gate never looks at the covariance. Widening it with the yaw
  # uncertainty is what lets an inflated belief re-associate. Normal operation is untouched: it takes
  # sigma_yaw > gate_angle/gate_yaw_scale (10 deg here) before the widened gate exceeds gate_angle.
  gate_yaw_scale: 2.0 # pre-gate widens to this many yaw std devs
  gate_angle_max: 1.0 # ceiling on the widened pre-gate [rad]
  min_confidence: 0.5 # reject detections below this confidence
  inlier_probability: 0.7 # inlier mixture weight at confidence_reference
  confidence_reference: 0.7 # confidence that maps to inlier_probability
  max_inlier_probability: 0.95

# Hypothesis-bank spawning/pruning/merging (only used when use_hypothesis_bank is true)
hypothesis:
  min_weight: 0.02 # prune components below this normalised weight
  max_components: 4 # cap on live components
  merge_position: 0.30 # merge gate on position separation [m]
  merge_yaw: 0.20 # merge gate on yaw separation [rad]
  respawn_pos_std: 0.60 # respawn a mirror when the lone component's horizontal std exceeds this [m]
