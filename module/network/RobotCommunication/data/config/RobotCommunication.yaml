# Controls the minimum log level that NUClear log will display
log_level: INFO
startup_delay: 3
ball_timeout: 3

# Team message port. Set to 0 to auto-compute as 10000 + team_id from GlobalConfig
# Override with a specific value if TC assigns a different team number at competition
send_port: 0
receive_port: 0
broadcast_ip: "172.168.207.255"
udp_filter_address: ""

# Maximum payload size in bytes per message
max_message_size: 512

# Maximum number of team messages per game
max_messages_per_game: 60000

# Share our latest ball and robot detections in the NUbots team data, for teammates' cooperative tracking
# (localisation::CooperativeLocalisation). Each detection costs about 5 bytes of the 128 byte team data budget
share_detections: true
# Detections older than this (s) when a message is sent are not shared
shared_detection_max_age: 0.5
# Maximum number of detections shared per message
max_shared_balls: 2
max_shared_robots: 8
