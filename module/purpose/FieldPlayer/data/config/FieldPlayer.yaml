# Controls the minimum log level that NUClear log will display
log_level: INFO

ball_threshold: 0.5
equidistant_threshold: 0.1
ball_off_center_threshold: 0.75
center_circle_offset: 0.5

# Used to rank who on the team should attack, by estimated time to a kick-ready position behind the ball.
# See fastest_to_ball_on_team in soccer_strategy.hpp
estimated_walk_speed: 0.7
estimated_turn_speed: 1.0
approach_distance_behind_ball: 0.4
attack_equidistant_time_threshold: 0.5

max_localisation_cost: 3.0
search_when_lost: false

# Maximum time in seconds to stand still and look around waiting to localise before playing anyway
localise_timeout: 8
