# Controls the minimum log level that NUClear log will display
log_level: INFO

# How long (ms) a world to camera transform is kept for matching against image timestamps
hcw_buffer_duration: 500
# How far (ms) an image capture timestamp may differ from our clock before we use the receive time instead
max_clock_skew: 1000

# Camera info:
# topic: Low-level topic for SDK to subscribe to
# name: Name of the camera
# id: ID of the camera
cameras:
  - topic: rt/boostercamera/head/rgb
    name: Left Camera
    id: 0
