log_level: INFO
field_type: lab # options: lab, small, l1, l3, middle, 5v5

# ROBOCUP FIELD SIZES
Units: m
BallRadius: 0.07
LineWidth: 0.06
# What shape the goal frame is (RECTANGLE,CIRCLE)
GoalpostType: CIRCLE
# The crossbar diameter and the goalpost diameter are (supposed to be) equal.
GoalpostWidth: 0.10
GoalpostDepth: 0.10
GoalCrossbarWidth: 0.10
GoalCrossbarDepth: 0.10
GoalNetHeight: 1.2
BorderStripMinWidth: 1.0
PenaltyRobotStart: 1.0

presets:
  # The NUbots lab field, from NUbots' FieldDescription.yaml. The lab also has a thinner LineWidth (0.05), lower
  # GoalNetHeight (1.0) and narrower BorderStripMinWidth (0.38), which aren't per-preset values, so a config
  # selecting this preset should override those too (see config/bin/test/localisation/FieldDescription.yaml).
  lab:
    FieldLength: 6.8
    FieldWidth: 5.0
    GoalDepth: 0.4
    GoalWidth: 1.95 # Distance between inner edges of goal posts.
    GoalCrossbarHeight: 0.55 # From the top of the wood to the ground.
    GoalAreaLength: 1.05
    GoalAreaWidth: 2.62
    PenaltyMarkDistance: 1.27 # Measured from the goal line to the middle of the penalty mark.
    CenterCircleDiameter: 1.5
    PenaltyAreaLength: 1.55
    PenaltyAreaWidth: 4.05
  small:
    FieldLength: 9.0
    FieldWidth: 6.0
    GoalDepth: 0.58
    GoalWidth: 2.575
    GoalCrossbarHeight: 1.2
    GoalAreaLength: 0.9 # GoalArea = "6 yard box"
    GoalAreaWidth: 2.9
    PenaltyMarkDistance: 1.47 # Measured from the goal line to the middle of the penalty mark.
    CenterCircleDiameter: 1.5
    PenaltyAreaLength: 1.9
    PenaltyAreaWidth: 3.9
  l1:
    FieldLength: 12.0
    FieldWidth: 9.0
    GoalWidth: 2.6
    GoalDepth: 0.6
    GoalCrossbarHeight: 1.25
    GoalAreaLength: 1.0
    GoalAreaWidth: 4.0
    PenaltyMarkDistance: 1.5
    CenterCircleDiameter: 1.5
    PenaltyAreaLength: 3.0
    PenaltyAreaWidth: 6.0
  l3:
    FieldLength: 14.0
    FieldWidth: 9.0
    GoalWidth: 2.6
    GoalDepth: 0.6
    GoalCrossbarHeight: 1.25
    GoalAreaLength: 1.0
    GoalAreaWidth: 4.0
    PenaltyMarkDistance: 1.5
    CenterCircleDiameter: 1.5
    PenaltyAreaLength: 3.0
    PenaltyAreaWidth: 6.0
  # RoboCup 2026 Humanoid Soccer League M-Field, played by the Middle Division (HSL rules, Law 1
  # "Dimensions"). The rules give ranges for the goal (width 2.4-2.6, height 1.5-1.9, depth
  # 0.7-1.2); these match NUSim's M-Field scene (models/k1/k1_scene_robocup_middle.xml).
  middle:
    FieldLength: 14.0
    FieldWidth: 9.0
    GoalWidth: 2.5
    GoalDepth: 0.7
    GoalCrossbarHeight: 1.75
    GoalAreaLength: 1.0
    GoalAreaWidth: 4.0
    PenaltyMarkDistance: 2.0
    CenterCircleDiameter: 3.0
    PenaltyAreaLength: 3.0
    PenaltyAreaWidth: 6.0
  5v5:
    FieldLength: 22.0
    FieldWidth: 14.0
    GoalWidth: 2.6 #needs measuring
    GoalDepth: 0.6 #needs measuring
    GoalCrossbarHeight: 1.25 #needs measuring
    GoalAreaLength: 2.0
    GoalAreaWidth: 5.0
    PenaltyMarkDistance: 3.5
    CenterCircleDiameter: 4
    PenaltyAreaLength: 5.0
    PenaltyAreaWidth: 8.0
