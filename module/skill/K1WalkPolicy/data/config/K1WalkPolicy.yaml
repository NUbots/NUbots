# Training keyframe (mjlab STAND_BENT_KNEES_KEYFRAME): arms tucked, legs crouched. Note the
# elbow yaws at -0.15 / +0.15 rather than 0: the elbow-yaw hard stop is at 0, which lies
# outside the 0.9 soft joint limit, so an arms-down pose at 0 would pay the joint-limit
# penalty every step of training. This is the one entry that differs from the previous
# mujoco_playground default_pose.
default_pose: [0, 0, 0, -1.3, 0, -0.15, 0, 1.3, 0, 0.15, -0.2, 0, 0, 0.4, -0.2, 0, -0.2, 0, 0, 0.4, -0.2, 0]

# Hard joint ranges used to clamp the commanded position. These are the mjlab k1.xml
# jnt_range values, except hip pitch, which is deliberately kept at the tighter
# mujoco_playground range: the policy's reachable hip-pitch envelope is only
# -0.763..0.363 rad, so the tighter clamp costs nothing and catches a runaway.
#
# A saturated action still commands past these on several joints -- shoulder roll by
# 0.447 rad, elbow yaw by 0.737, hip roll by 0.486, knee by 0.064 -- and MuJoCo absorbs
# that silently while the robot does not. Clamping is counted and logged at DEBUG.
