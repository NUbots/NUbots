log_level: INFO

# mujoco_playground K1Getup fall-recovery policy (72-obs / 22-action ONNX). Actions are
# offsets on the CURRENT joint configuration (Go1Getup convention). All joint arrays are
# in the Booster SDK JointIndexK1 serial order.
# Variants: k1_getup_frasa_20260716_1250M.onnx (FRASA single-kernel reward, 1.25B),
# k1_getup_v4_20260716_1250M.onnx (shaped reward v4, 1.25B), and the 2026-07-17
# warm-started 150M runs (both init from the FRASA 1.25B checkpoint, body-wide
# oscillation cost added): k1_getup_frasa_warm_20260717_150M.onnx (weighted-hips
# FRASA kernel) / k1_getup_v5_warm_20260717_150M.onnx (shaped reward v5).
# k1_getup_v6_20260717_1153M.onnx: shaped reward v6, fresh 1.15B-step run (2026-07-17).
# k1_getup_v7_20260718_300M.onnx: v7 rewards (height_progress potential, hand_support,
# staged orientation, no leg_activity), 300M scratch (2026-07-18).
model_path: "k1_getup_v21_20260725_984M.onnx"

# Inference device: cpu, or gpu (ONNX Runtime's TensorRT execution provider). gpu falls back
# to the CPU automatically when TensorRT cannot be set up, e.g. no CUDA device is visible (the
# container needs --gpus), so this is safe to leave on.
device: gpu

# |roll| and |pitch| below this angle (rad) count as upright; sustained for
# upright_time seconds (with knees extended and gyro settled) the get-up reports Done.
upright_angle: 0.35
upright_time: 2.0
# Gyro norm must stay below this (rad/s) for the whole upright_time window — a
# posture-only check fires while the robot is still oscillating from a dynamic rise
# and hands the walk policy a moving robot.
settled_gyro: 0.5
# Both knees must be flexed less than this (rad) to count as standing — the torso is
# already vertical mid-rise, so attitude alone hands off to the walk policy too early
# (standing knee ~0.4 rad, mid-rise > 1 rad).
knee_extended_angle: 0.9

# Global multiplier on action_scale_joint. MUST match the training config's
# action_scale (K1Getup trains with 3.0: get-up needs ~75% of the actuator torque
# limits, walking only 25%).
action_scale: 3.0

# Training-time actuation, identical to K1WalkPolicy (same playground model): kp = the
# XML position-actuator gains, kd = joint damping, action_scale_joint =
# 0.25 * effort_limit / kp.
kp: [3.948, 3.948,
     3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692]
kd: [0.251, 0.251,
     0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26]
action_scale_joint: [0.3799, 0.3799,
                     0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683]
# Training keyframe ("home"), used only for the q - default_pose observation terms
default_pose: [0, 0,
               0, -1.3, 0, 0,
               0, 1.3, 0, 0,
               -0.2, 0, 0, 0.4, -0.2, 0,
               -0.2, 0, 0, 0.4, -0.2, 0]
