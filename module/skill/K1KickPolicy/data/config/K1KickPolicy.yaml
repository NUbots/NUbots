log_level: INFO

# mujoco_playground K1Kick policy (v5 side-sweep, 80-obs / 22-action ONNX). Observation
# layout: gyro(3), projected gravity(3), commanded kick direction in torso frame(2),
# ball xy in torso frame(2), gait phase [cos_L,cos_R,sin_L,sin_R](4), q - default_pose(22),
# dq(22), last_action(22). All joint arrays are in the Booster SDK JointIndexK1 serial order
# (head x2, L arm x4, R arm x4, L leg x6, R leg x6). Actions are offsets on the default pose
# (the walk/joystick convention), not the current pose.
model_path: "k1_kick_v7_20260728_2504M.onnx"

# Inference device: cpu, or gpu (ONNX Runtime's TensorRT execution provider). gpu falls back
# to the CPU automatically when TensorRT cannot be set up, e.g. no CUDA device is visible (the
# container needs --gpus), so this is safe to leave on.
device: gpu

# How long to run the policy once a Kick task starts, before reporting Done (s).
kick_duration: 4.0
# Ignore ball estimates below this localisation confidence.
ball_confidence_threshold: 0.1
# Treat the ball obs as absent (origin) if the last estimate is older than this (s).
ball_stale_timeout: 1.0
# Gait-phase advance rate (Hz), shared with the walk policy so the walk<->kick handoff is
# phase-continuous (training gait_freq = 1.5).
gait_frequency: 1.5
# Default lateral sweep direction in the torso frame (unit xy) when no ball is visible to
# pick a side; +y = sweep to the robot's left.
kick_direction: [0.0, 1.0]
# Walk->kick handoff cross-fade (s): commanded pose ramps from the current walk stance into
# the policy output over this window so the robot does not snap to the default crouch (which
# reads as a freeze then a fall). Training always starts at the default pose; deployment does
# not. 0 disables the blend.
handoff_blend: 0.3

action_scale: 1.0 # global multiplier on action_scale_joint (training config action_scale)

# Training-time actuation, mirrored from the playground k1_mjx_feetonly.xml (shared with
# the walk policy — same model): kp = position-actuator gains; kd = joint damping;
# action_scale_joint = 0.25 * effort_limit / kp (booster_train convention).
kp: [3.948, 3.948,
     3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692]
kd: [0.251, 0.251,
     0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26]
action_scale_joint: [0.3799, 0.3799,
                     0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683]
# Training keyframe ("home"): arms tucked, legs crouched
default_pose: [0, 0,
               0, -1.3, 0, 0,
               0, 1.3, 0, 0,
               -0.2, 0, 0, 0.4, -0.2, 0,
               -0.2, 0, 0, 0.4, -0.2, 0]
