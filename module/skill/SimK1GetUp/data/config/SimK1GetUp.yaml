log_level: INFO

# Path to the fall-recovery policy
model_path: "getup.onnx"

# Inference device: cpu, or gpu (ONNX Runtime TensorRT EP, fp16). Gpu falls back to cpu on its own when no CUDA device
# is usable.
device: cpu

# |roll| and |pitch| below this angle (rad) count as upright; sustained for
# upright_time seconds (with knees extended and gyro settled).
upright_angle: 0.35
upright_time: 2.0

# Gyro norm must stay below this (rad/s) for the whole upright_time window
settled_gyro: 0.5

# Both knees must be flexed less than this (rad) to count as standing
knee_extended_angle: 0.9

# Global multiplier on action_scale_joint. MUST match the training config's
# action_scale, may be subject to some tuning when another policy is introduced
action_scale: 3.0

# Training-time actuation
# kp = the XML position-actuator gains,
# kd = joint damping,
# action_scale_joint = 0.25 * effort_limit / kp.
